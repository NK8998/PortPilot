name: build-windows

# ARM64 CI template. Two rules that matter:
#   1. Build x64 AND arm64 in one matrix, so x64 can never silently regress.
#   2. Assert the built binary is actually ARM64 - a green build log proves nothing.
#      An MSBuild project missing an ARM64 platform mapping will happily produce
#      x64 output and report success.
#
# Runner image contents (check before installing anything - MSVC ARM64, CMake,
# vcpkg, .NET, Node, Python, Rust and Go are preinstalled):
# https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # x64 baseline - must stay green
            arch: x64
            cmake_arch: x64
            expect_machine: x64
          - os: windows-11-arm   # native ARM64: builds AND runs tests
            arch: arm64
            cmake_arch: ARM64
            expect_machine: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # --- adjust the three steps below to your build system -----------------

      - name: Configure
        run: cmake -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        # Runs natively on windows-11-arm. Do NOT cross-compile and skip tests -
        # you cannot execute ARM64 binaries on an x64 runner.
        run: ctest --test-dir build -C Release --output-on-failure

      # --- architecture assertion: the check that catches silent x64 output ---

      - name: Verify binary architecture
        shell: pwsh
        run: |
          $expected = '${{ matrix.expect_machine }}'
          $binaries = Get-ChildItem -Path build -Recurse -Include *.exe, *.dll -File
          if (-not $binaries) { throw "No binaries found to verify." }

          $failed = @()
          foreach ($b in $binaries) {
            # dumpbin prints e.g. "AA64 machine (ARM64)" or "8664 machine (x64)"
            $line = (dumpbin /headers $b.FullName | Select-String 'machine \(' | Select-Object -First 1).ToString()
            Write-Host "$($b.Name): $($line.Trim())"

            $ok = switch ($expected) {
              'ARM64' { $line -match 'AA64' }   # AA64 covers ARM64 / ARM64EC / ARM64X
              'x64'   { $line -match '8664' }
              default { $false }
            }
            if (-not $ok) { $failed += "$($b.Name) -> $($line.Trim())" }
          }

          if ($failed) {
            throw "Expected $expected but found:`n$($failed -join "`n")"
          }
          Write-Host "All binaries verified as $expected."

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: build/**/Release/*
          if-no-files-found: error
