name: Native Windows ARM64
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86
      - name: Build ARM64 Debug
        run: msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=ARM64 /p:PreferredToolArchitecture=arm64
      - name: Run tests
        run: ./RunTests.ps1 -Platform ARM64 -Configuration Debug
